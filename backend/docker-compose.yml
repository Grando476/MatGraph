services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/edumath
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=edumath
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d edumath"]
      interval: 3s
      timeout: 3s
      retries: 5

  flyway:
    image: flyway/flyway:10-alpine
    command: -url=jdbc:postgresql://db:5432/edumath -user=postgres -password=postgres -connectRetries=60 -baselineOnMigrate=true migrate
    volumes:
      - ./migrations:/flyway/sql
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
